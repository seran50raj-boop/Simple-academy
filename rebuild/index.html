<style>

.25s}.milestones{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:12px}.milestone{flex:1;max-width:110px;min-width:0;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#607a76;font-size:.85rem}.milestone.current{border:2px solid var(--teal);color:var(--teal)}.milestone.complete{background:#e8f6f1;color:#136e5b}.milestone:disabled{opacity:.38;cursor:not-allowed}.mobilehint{display:none}svg{overflow:visible}
@media(max-width:740px){.card{grid-template-columns:1fr;gap:4px;min-height:0;padding:26px 22px}.art{max-height:200px;order:-1}.main{padding:16px 12px 105px}h1{font-size:2rem}.bottom{padding:12px}.nav{padding:10px 12px}.unit{display:none}.mobilehint{display:block;font-size:.78rem;color:#5e7773;text-align:center;margin-top:12px}}

[hidden]{display:none!important}
.header-actions{display:flex;align-items:center;gap:18px}.map-link{border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--teal);padding:9px 12px;font-weight:700}
.map-screen{width:min(100%,1000px);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px #164e4510;padding:clamp(24px,4vw,48px);text-align:center}
.map-eyebrow{font-size:.76rem;letter-spacing:.16em;color:var(--teal);font-weight:800;text-transform:uppercase}.map-screen h1{max-width:650px;margin:16px auto}.map-intro{max-width:610px;margin:0 auto;color:#506c68}
.route-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,1fr);grid-template-areas:"a b c" "f e d";height:420px;align-items:center;justify-items:center;margin:20px auto;max-width:900px;isolation:isolate}
.route-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}.route-path-mobile{display:none}
.stop{grid-area:auto;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;width:100%;color:#244944;transition:transform .18s ease}
.stop:not(:disabled):hover{transform:translateY(-4px)}.stop:disabled{cursor:not-allowed;color:#82948f}
.stop-marker{height:68px;width:68px;display:grid;place-items:center;background:#f4f8f6;border:2px solid #bed5ce;border-radius:50%;box-shadow:0 7px 20px #214c4012;font-size:1.6rem;font-weight:800}
.stop.available .stop-marker{background:#e1f7f0;border:3px solid var(--teal);color:var(--teal);box-shadow:0 0 0 7px #e1f7f088}
.stop.visited .stop-marker{background:#f0f9f5;border-color:#75a99c;color:#18665c}
.stop.locked .stop-marker{background:#f5f6f5;border-color:#d7e1dc;color:#94aaa2}
.stop-word{font-weight:800;font-size:clamp(.85rem,1.5vw,1.12rem);line-height:1.3}
.stop-kind{font-size:.7rem;color:#68837c;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.map-legend{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;color:#526d68;font-size:.83rem}
.map-legend span{display:inline-flex;gap:6px;align-items:center}.map-legend b{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;font-size:.8rem}
.map-actions{display:flex;align-items:center;flex-direction:column;gap:10px;margin-top:24px}.map-actions .nav{min-width:180px}.map-actions small{color:#59736e}
@media(max-width:740px){.header-actions{gap:7px}.map-link{font-size:.8rem;padding:8px}.map-screen{padding:22px 12px}.map-screen h1{font-size:2.15rem}.route-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,1fr);grid-template-areas:"a b" "d c" "e f";height:480px;margin:15px auto}.route-path-desktop{display:none}.route-path-mobile{display:block}.stop-marker{height:58px;width:58px}.stop-kind{font-size:.65rem}.map-legend{gap:10px}}
@media(prefers-reduced-motion:reduce){.stop{transition:none}}

/* First fully art-directed Andragogy card: simplified editorial vectors, independent animated jigsaw pieces */
.hero-scene{margin:0;width:100%;max-width:590px}
.hero-art{display:block;width:100%;height:auto;max-height:none;overflow:visible}
.art-caption{font-size:.76rem;font-weight:750;color:#665d55;letter-spacing:.055em;text-align:center;margin-top:0}
#visual{min-width:0}
.hero-scene .part{transform-box:fill-box;transform-origin:center;transition:transform .72s cubic-bezier(.2,.78,.2,1)}
.hero-scene .part-experience{transition-delay:.04s}
.hero-scene .part-purpose{transition-delay:.19s}
.hero-scene .part-autonomy{transition-delay:.33s}
.hero-scene.replaying .part-experience{transform:translate(-36px,-18px) rotate(-5deg)}
.hero-scene.replaying .part-purpose{transform:translate(34px,-25px) rotate(5deg)}
.hero-scene.replaying .part-autonomy{transform:translate(-15px,29px) rotate(-4deg)}
.hero-scene .person{transition:transform .7s ease}
.hero-scene.replaying .person-left{transform:translate(-4px,1px)}
.hero-scene.replaying .person-right{transform:translate(3px,1px)}
.illustration-play{margin-top:20px;padding:10px 16px;border-radius:100px;background:#fff4e7;color:#75422e;border:1px solid #e9bea1;font-weight:750;font-size:.93rem}
.illustration-play:hover{background:#ffe9d6}
.concept-art{min-height:280px;background:#f5f8f5;border:1px dashed #c3d9d3;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:16px;flex-direction:column;color:#61857a;text-align:center;padding:20px}
.concept-art span{font-size:5rem;line-height:1}.concept-art small{font-size:.82rem}
.bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:16px;row-gap:7px}
.bottom .milestones{grid-column:1/-1;grid-row:1;margin:0;justify-content:stretch}
.bottom #prev{grid-column:1;grid-row:2}
.bottom .progress{grid-column:2;grid-row:2;min-width:0}
.bottom #next{grid-column:3;grid-row:2}
.main{padding-bottom:152px}
.card{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);min-height:450px}
@media(max-width:740px){
 .card{grid-template-columns:1fr;padding:22px 18px}
 #visual{order:-1}
 .hero-scene{max-width:450px;margin:auto}
 .illustration-play{margin:10px 0 16px}
 .main{padding-bottom:172px}
 .bottom{column-gap:9px;padding:10px 12px}
 .bottom .milestone{height:27px}
 .bottom .nav{padding:9px 11px}
 .art-caption{margin:0 0 10px}
}
@media(prefers-reduced-motion:reduce){.hero-scene .part,.hero-scene .person{transition:none!important}}
</style>

<body>
<div class="shell"><header class="top"><div class="brand">SIM<span>ple</span> Academy</div><div class="header-actions"><div class="unit">Module 1 · Foundations of Andragogy</div><button class="map-link" id="map-link" type="button" hidden>Course map</button></div></header><main class="main">
<section class="map-screen" id="map-screen" aria-labelledby="map-title">
<div class="map-eyebrow">Module 1 · Your learning journey</div>
<h1 id="map-title">Explore Andragogy</h1>
<p class="map-intro">Follow the route from concept to practice. Each stop is one card. Questions unlock the path forward.</p>
<nav class="route-grid" id="route-grid" aria-label="Andragogy card map">
<svg class="route-path route-path-desktop" viewBox="0 0 900 420" preserveAspectRatio="none" aria-hidden="true"><path d="M150 105 H750 Q825 105 825 210 Q825 315 750 315 H150" fill="none" stroke="#dce9e6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/></svg>
<svg class="route-path route-path-mobile" viewBox="0 0 600 480" preserveAspectRatio="none" aria-hidden="true"><path d="M150 80 H450 Q520 80 520 160 Q520 240 450 240 H150 Q80 240 80 320 Q80 400 150 400 H450" fill="none" stroke="#dce9e6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/></svg>
</nav>
<div class="map-legend"><span><b>▤</b> Learning</span><span><b>?</b> Question</span><span><b>✓</b> Completed</span></div>
<div class="map-actions"><button class="nav primary" id="start-map" type="button">Start learning →</button><small id="map-summary" aria-live="polite"></small></div>
</section>
<section id="cards-screen" hidden><article class="card" aria-live="polite"><div><div class="kicker" id="kicker"></div><h1 id="heading"></h1><p id="body"></p><div id="interaction"></div></div><div id="visual"></div></article><div class="mobilehint">Swipe to navigate unlocked cards</div></section></main><footer class="bottom" id="bottom" hidden><nav class="milestones" id="milestones" aria-label="Course card progress"></nav><button class="nav" id="prev">← Back</button><div class="progress"><small id="count"></small><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav primary" id="next">Next →</button></footer></div>
<script>
const artwork="<svg class=\"art hero-art\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 610 440\" role=\"img\" aria-label=\"Three faceless adult learners collaboratively assembling a large colourful learning puzzle\">\n<defs>\n<filter id=\"shadow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"180%\"><feGaussianBlur stdDeviation=\"6\"/></filter>\n<pattern id=\"grain\" width=\"13\" height=\"13\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"4\" r=\".75\" fill=\"#8E7063\" opacity=\".3\"/><circle cx=\"9\" cy=\"10\" r=\".65\" fill=\"#8E7063\" opacity=\".22\"/></pattern>\n</defs>\n<path d=\"M112 100Q239 21 410 78Q531 114 524 273Q500 387 294 387Q112 370 83 244Q61 159 112 100Z\" fill=\"#EDF5F2\"/>\n<ellipse cx=\"305\" cy=\"385\" rx=\"246\" ry=\"21\" fill=\"#B48E7B\" opacity=\".12\"/>\n<path d=\"M112 213L368 140L534 289L279 380Z\" fill=\"#6A463F\" opacity=\".17\" filter=\"url(#shadow)\" transform=\"translate(3 11)\"/>\n<path d=\"M112 213L368 140L534 289L279 380Z\" fill=\"#FFF7ED\" stroke=\"#E5D3C6\" stroke-width=\"2\"/>\n<path d=\"M144 236L371 168M171 272L401 203M207 315L443 245M250 350L485 282\" stroke=\"#DABBA7\" opacity=\".5\" stroke-width=\"2\"/>\n<g class=\"part part-experience\"><path d=\"M213 223L289 201Q304 225 322 217Q338 209 333 186L370 176L414 217L348 242Q341 264 322 269Q307 272 294 255L248 276Z\" fill=\"#F1794A\" stroke=\"#FFF7ED\" stroke-width=\"4\" stroke-linejoin=\"round\"/></g>\n<g class=\"part part-autonomy\"><path d=\"M145 254L211 231L248 276L294 255Q307 272 322 269L351 306L260 337Z\" fill=\"#F0AF4B\" stroke=\"#FFF7ED\" stroke-width=\"4\" stroke-linejoin=\"round\"/></g>\n<g class=\"part part-purpose\"><path d=\"M370 176L425 211L490 274L351 306L322 269Q341 264 348 242L414 217Z\" fill=\"#9FCFDE\" stroke=\"#FFF7ED\" stroke-width=\"4\" stroke-linejoin=\"round\"/></g>\n<g class=\"person person-left\"><path d=\"M79 333Q46 314 45 279L61 215Q70 186 94 189L128 201Q145 219 147 255L148 322Z\" fill=\"#F27746\"/><path d=\"M78 185Q64 169 73 151Q84 129 113 134Q140 139 134 164Q130 182 114 191L110 205L82 198Z\" fill=\"#E3AA87\"/><path d=\"M72 162Q67 132 92 125Q127 115 138 146Q131 141 118 140Q107 157 91 153Q89 171 78 179Z\" fill=\"#75483C\"/><path d=\"M108 237L168 270L213 242\" fill=\"none\" stroke=\"#F27746\" stroke-width=\"30\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M208 238L220 235\" stroke=\"#E3AA87\" stroke-width=\"13\" stroke-linecap=\"round\"/><path d=\"M77 327L64 362L96 366L117 333M126 325L127 370L156 370L158 321\" fill=\"#6E514C\"/><path d=\"M90 197L107 199\" stroke=\"#FFF7ED\" stroke-width=\"8\" stroke-linecap=\"round\"/></g>\n<g class=\"person person-top\"><path d=\"M352 146Q337 114 345 83Q359 58 397 64Q431 78 433 118L437 158L414 192L362 179Z\" fill=\"#99CADD\"/><path d=\"M365 91Q364 70 384 67Q407 67 408 89Q408 111 386 119L376 123L366 107Z\" fill=\"#E6B18D\"/><path d=\"M363 84Q360 60 377 55Q402 48 416 71Q400 67 389 75Q381 82 363 84Z\" fill=\"#80513E\"/><path d=\"M408 121L445 144L415 181L387 166\" fill=\"#E5C4A2\"/><path d=\"M412 127L439 136L418 159L395 149Z\" fill=\"#FFF8ED\"/><path d=\"M346 158L328 191\" stroke=\"#99CADD\" stroke-width=\"25\" stroke-linecap=\"round\"/><path d=\"M325 190L315 195\" stroke=\"#E6B18D\" stroke-width=\"14\" stroke-linecap=\"round\"/></g>\n<g class=\"person person-right\"><path d=\"M429 347Q408 314 418 278Q427 256 449 246Q477 244 490 269L519 345Z\" fill=\"#D68464\"/><path d=\"M444 241Q432 219 446 204Q460 187 481 196Q496 209 486 228L475 243L473 260L447 259Z\" fill=\"#DFA789\"/><path d=\"M440 221Q435 193 454 187Q486 180 499 212Q489 208 483 202Q471 208 454 204Q453 224 440 234Z\" fill=\"#6D4039\"/><path d=\"M435 280L397 313L363 302\" fill=\"none\" stroke=\"#D68464\" stroke-width=\"23\" stroke-linecap=\"round\"/><path d=\"M360 301L348 302\" stroke=\"#DFA789\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"M461 345L458 385L478 388L496 346\" fill=\"#674642\"/></g>\n<path d=\"M0 0h610v440H0Z\" fill=\"url(#grain)\" opacity=\".24\" pointer-events=\"none\"/>\n</svg>";
const cards=[
{k:"Welcome",word:"Welcome",h:"Learning fits together.",b:"Adult learning starts with people—not just content. Experience, autonomy and purpose combine to make learning meaningful."},
{k:"Core principle",word:"Experience",h:"Experience is an asset.",b:"Adult learners bring prior clinical and personal experience. Effective teaching uses that experience rather than ignoring it."},
{k:"Think and decide",word:"Choose",h:"Which activity is more learner-centred?",b:"Choose the approach that best uses the learner’s experience.",q:["A 40-minute lecture with no discussion","A clinical case where learners compare decisions with their own practice"],answer:1,why:"Correct. The clinical case activates prior experience and encourages reflection."},
{k:"Apply it",word:"Relevance",h:"Make learning relevant.",b:"Connect each teaching activity to a real clinical problem the learner recognises. Explain why the skill matters now."},
{k:"Knowledge check",word:"Diagnose",h:"What should come first?",b:"You are designing a session for experienced emergency residents.",q:["Find out what learners already know and need","Assume every learner is starting from zero"],answer:0,why:"Correct. Diagnosing prior knowledge and learning needs is a useful starting point."},
{k:"Next steps",word:"Future",h:"Build on the foundations.",b:"This is a working preview, not the complete course. Next we can restore the approved artwork, develop the full curriculum, and add further interactions."}
];

let current=0,furthest=0;
const completed=new Set(),answers=new Map();
const $=id=>document.getElementById(id);
const saveKey='simple-academy-andragogy-rebuild-v1';
try{
 const stored=JSON.parse(localStorage.getItem(saveKey)||'null');
 if(stored&&typeof stored==='object'){
  if(Array.isArray(stored.answers))stored.answers.forEach(entry=>{
   if(Array.isArray(entry)&&Number.isInteger(entry[0])&&Number.isInteger(entry[1])&&cards[entry[0]]?.answer===entry[1]){
    answers.set(entry[0],entry[1]);completed.add(entry[0]);
   }
  });
  const requested=Number.isInteger(stored.furthest)?Math.min(Math.max(stored.furthest,0),cards.length-1):0;
  furthest=requested;
  for(let i=0;i<requested;i++){if(cards[i].q&&!completed.has(i)){furthest=i;break;}}
 }
}catch(error){/* Local storage may be disabled; navigation still works. */}
function saveProgress(){
 try{localStorage.setItem(saveKey,JSON.stringify({furthest,answers:[...answers]}));}catch(error){}
}
function renderMap(){
 const nav=$('route-grid');
 nav.querySelectorAll('.stop').forEach(node=>node.remove());
 cards.forEach((c,i)=>{
  const unlocked=i<=furthest;
  const kind=c.q?'Question':'Learning';
  const status=!unlocked?'locked':i<furthest||completed.has(i)?'visited':'available';
  const btn=document.createElement('button');
  btn.type='button';btn.className='stop '+status;btn.style.gridArea=String.fromCharCode(97+i);
  btn.disabled=!unlocked;
  btn.setAttribute('aria-label',c.word+', '+kind.toLowerCase()+' card, '+(unlocked?'unlocked':'locked'));
  if(i===furthest)btn.setAttribute('aria-current','step');
  const marker=document.createElement('span');marker.className='stop-marker';marker.textContent=completed.has(i)?'✓':(c.q?'?':'▤');
  const name=document.createElement('span');name.className='stop-word';name.textContent=c.word;
  const category=document.createElement('span');category.className='stop-kind';category.textContent=kind;
  btn.append(marker,name,category);
  btn.addEventListener('click',()=>showCard(i));nav.appendChild(btn);
 });
 $('start-map').textContent=furthest?'Continue learning →':'Start learning →';
 $('map-summary').textContent=(furthest+1)+' of '+cards.length+' cards unlocked';
}
function showMap(){
 $('map-screen').hidden=false;$('cards-screen').hidden=true;$('bottom').hidden=true;$('map-link').hidden=true;
 renderMap();window.scrollTo(0,0);
}
function showCard(index){
 if(index<0||index>furthest||index>=cards.length)return;
 current=index;$('map-screen').hidden=true;$('cards-screen').hidden=false;$('bottom').hidden=false;$('map-link').hidden=false;
 render();window.scrollTo(0,0);
}
function render(){
 const c=cards[current];
 $('kicker').textContent=c.k;$('heading').textContent=c.h;$('body').textContent=c.b;if(current===0){
  $('visual').innerHTML='<figure class="hero-scene" aria-label="Illustration of adults joining a learning puzzle">'+artwork+'<figcaption class="art-caption">Experience · Autonomy · Purpose</figcaption></figure>';
  $('interaction').replaceChildren();
  const btn=document.createElement('button');btn.type='button';btn.className='illustration-play';
  btn.textContent='↻ Watch the pieces connect';
  btn.addEventListener('click',()=>{
    const scene=$('visual').querySelector('.hero-scene');
    scene.classList.add('replaying');
    setTimeout(()=>{if(scene.isConnected)scene.classList.remove('replaying');},220);
  });
  $('interaction').appendChild(btn);
 }else{
  $('visual').innerHTML='<div class="concept-art" role="img" aria-label="A future concept-specific illustration"><span aria-hidden="true">✳</span><small>Illustration in development</small></div>';
  $('interaction').replaceChildren();
 }
 if(c.q){
  const wrap=document.createElement('div');wrap.className='choices';
  c.q.forEach((option,i)=>{
   const btn=document.createElement('button');btn.className='choice';
   btn.type='button';btn.textContent=option;
   if(answers.get(current)===i)btn.classList.add('selected');
   if(completed.has(current))btn.disabled=true;
   btn.addEventListener('click',()=>{
    if(completed.has(current))return;
    wrap.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    const feedback=$('feedback');
    if(i===c.answer){
     answers.set(current,i);completed.add(current);saveProgress();
     feedback.className='feedback good';feedback.textContent=c.why;
     wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
    }else{
     feedback.className='feedback bad';feedback.textContent='Not quite. Try another option.';
    }
    updateNav();
   });
   wrap.appendChild(btn);
  });
  $('interaction').appendChild(wrap);
  const fb=document.createElement('div');fb.id='feedback';fb.className='feedback';fb.setAttribute('role','status');
  if(completed.has(current)){fb.className='feedback good';fb.textContent=c.why;}
  $('interaction').appendChild(fb);
 }
 updateNav();
}
function updateNav(){
 const nav=$('milestones');nav.replaceChildren();
 cards.forEach((c,i)=>{
  const btn=document.createElement('button');btn.type='button';
  btn.className='milestone'+(i===current?' current':'')+(completed.has(i)?' complete':'');
  btn.textContent=(c.q?'?':'▤')+(completed.has(i)?' ✓':'');
  btn.title=(c.q?'Question: ':'Learning: ')+c.word;
  btn.setAttribute('aria-label',btn.title);
  if(i===current)btn.setAttribute('aria-current','step');
  btn.disabled=i>furthest;
  btn.addEventListener('click',()=>showCard(i));
  nav.appendChild(btn);
 });
 $('prev').disabled=false;
 $('prev').textContent=current===0?'← Map':'← Back';
 $('next').disabled=current===cards.length-1||(!!cards[current].q&&!completed.has(current));
 $('next').textContent=current===cards.length-1?'Finished ✓':'Next →';
 $('count').textContent='Card '+(current+1)+' of '+cards.length;
 $('fill').style.width=((current+1)/cards.length*100)+'%';
}
function go(direction){
 if(direction<0){
  if(current===0){showMap();return;}
  showCard(current-1);return;
 }
 if(direction>0){
  if(current===cards.length-1||(cards[current].q&&!completed.has(current)))return;
  const next=current+1;
  if(next>furthest){furthest=next;saveProgress();}
  showCard(next);
 }
}
$('map-link').addEventListener('click',showMap);
$('start-map').addEventListener('click',()=>showCard(furthest));
$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
document.addEventListener('keydown',event=>{
 if($('cards-screen').hidden||event.target.closest('button,input,textarea,select'))return;
 if(event.key==='ArrowRight')go(1);
 if(event.key==='ArrowLeft')go(-1);
});
let touchStart=null;
document.querySelector('.card').addEventListener('touchstart',event=>{
 touchStart=event.changedTouches[0].clientX;
},{passive:true});
document.querySelector('.card').addEventListener('touchend',event=>{
 if(touchStart===null)return;
 const delta=event.changedTouches[0].clientX-touchStart;
 if(Math.abs(delta)>70)go(delta<0?1:-1);
 touchStart=null;
},{passive:true});
showMap();
</script>
</body></html>
