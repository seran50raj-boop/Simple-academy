<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMple Academy · Rebuild Preview</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#173638;background:#f7f9f8;--teal:#087f79;--line:#dce9e6}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e9a94e;outline-offset:3px}
.shell{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,52px);border-bottom:1px solid var(--line);background:#fff}.brand{font-weight:800;letter-spacing:-.03em;font-size:1.25rem}.brand span{color:var(--teal)}.unit{font-size:.85rem;color:#587471}.main{width:min(100%,1000px);margin:auto;padding:28px 18px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;min-height:520px;padding:clamp(22px,5vw,58px);box-shadow:0 18px 60px #164e4510;display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}.kicker{font-size:.8rem;letter-spacing:.13em;font-weight:800;color:var(--teal);text-transform:uppercase}h1{font-size:clamp(2.1rem,4.4vw,3.6rem);line-height:1.08;letter-spacing:-.05em;margin:15px 0 22px}p{font-size:clamp(1.05rem,1.8vw,1.22rem);line-height:1.65;color:#45615e}.art{width:100%;height:auto;max-height:340px}.choices{display:grid;gap:12px;margin-top:25px}.choice{border:2px solid var(--line);background:#fff;padding:15px 18px;text-align:left;border-radius:15px;font-weight:650;color:#204743}.choice:hover,.choice:focus-visible{border-color:var(--teal)}.choice.selected{border-color:var(--teal);background:#e9f7f3}.feedback{font-weight:700;min-height:26px;margin-top:15px}.feedback.good{color:#13735a}.feedback.bad{color:#a14535}.bottom{position:fixed;bottom:0;width:100%;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:14px max(18px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:16px}.nav{border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:#fff;font-weight:750}.nav.primary{background:#087f79;color:white;border-color:#087f79}.nav:disabled{opacity:.4;cursor:not-allowed}.progress{flex:1}.progress small{display:block;color:#54716d;margin-bottom:6px}.track{height:8px;background:#e5efed;border-radius:10px;overflow:hidden}.fill{height:100%;background:#087f79;transition:width .25s}.milestones{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:12px}.milestone{flex:1;max-width:110px;min-width:0;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#607a76;font-size:.85rem}.milestone.current{border:2px solid var(--teal);color:var(--teal)}.milestone.complete{background:#e8f6f1;color:#136e5b}.milestone:disabled{opacity:.38;cursor:not-allowed}.mobilehint{display:none}svg{overflow:visible}
@media(max-width:740px){.card{grid-template-columns:1fr;gap:4px;min-height:0;padding:26px 22px}.art{max-height:200px;order:-1}.main{padding:16px 12px 105px}h1{font-size:2rem}.bottom{padding:12px}.nav{padding:10px 12px}.unit{display:none}.mobilehint{display:block;font-size:.78rem;color:#5e7773;text-align:center;margin-top:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand">SIM<span>ple</span> Academy</div><div class="unit">Module 1 · Foundations of Andragogy</div></header><main class="main"><article class="card" aria-live="polite"><div><div class="kicker" id="kicker"></div><h1 id="heading"></h1><p id="body"></p><div id="interaction"></div></div><div id="visual"></div></article><nav class="milestones" id="milestones" aria-label="Course card progress"></nav><div class="mobilehint">Swipe to navigate unlocked cards</div></main><footer class="bottom"><button class="nav" id="prev">← Back</button><div class="progress"><small id="count"></small><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav primary" id="next">Next →</button></footer></div>
<script>
const artwork='<svg class="art" viewBox="0 0 460 360" role="img" aria-label="An adult learner explores a new idea with a facilitator"><rect x="34" y="52" width="390" height="268" rx="35" fill="#EAF6F2"/><circle cx="346" cy="102" r="47" fill="#FAD6A0"/><path d="M65 282h330" stroke="#8FBEB4" stroke-width="8" stroke-linecap="round"/><rect x="105" y="214" width="247" height="16" rx="8" fill="#204E4B"/><rect x="134" y="230" width="13" height="52" rx="6" fill="#204E4B"/><rect x="315" y="230" width="13" height="52" rx="6" fill="#204E4B"/><path d="M151 163c0-36 20-54 52-54s52 18 52 54v49H151z" fill="#0D9488"/><circle cx="202" cy="89" r="36" fill="#E5AB84"/><path d="M166 87c-3-42 65-58 73-5-20-2-30-15-38-20-8 16-21 22-35 25" fill="#253D40"/><path d="M258 211l25-87 68 20-25 67z" fill="#F5B95D"/><path d="M283 124l68 20-5 16-68-20z" fill="#FFF4DC"/><path d="M254 178l39-29" stroke="#E5AB84" stroke-width="17" stroke-linecap="round"/><circle cx="320" cy="75" r="13" fill="#0D9488"/><path d="M320 66v18m-9-9h18" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M89 131l12-19 12 19-12 19z" fill="#F08A75"/><path d="M367 241l11-17 11 17-11 17z" fill="#F08A75"/></svg>';
const cards=[
{k:"Welcome",h:"Adults learn differently.",b:"Welcome to Foundations of Andragogy. Explore how experience, autonomy and relevance shape adult learning."},
{k:"Core principle",h:"Experience is an asset.",b:"Adult learners bring prior clinical and personal experience. Effective teaching uses that experience rather than ignoring it."},
{k:"Think and decide",h:"Which activity is more learner-centred?",b:"Choose the approach that best uses the learner’s experience.",q:["A 40-minute lecture with no discussion","A clinical case where learners compare decisions with their own practice"],answer:1,why:"Correct. The clinical case activates prior experience and encourages reflection."},
{k:"Apply it",h:"Make learning relevant.",b:"Connect each teaching activity to a real clinical problem the learner recognises. Explain why the skill matters now."},
{k:"Knowledge check",h:"What should come first?",b:"You are designing a session for experienced emergency residents.",q:["Find out what learners already know and need","Assume every learner is starting from zero"],answer:0,why:"Correct. Diagnosing prior knowledge and learning needs is a useful starting point."},
{k:"Next steps",h:"Build on the foundations.",b:"This is a working preview, not the complete course. Next we can restore the approved artwork, develop the full curriculum, and add further interactions."}
];
let current=0;let furthest=0;const completed=new Set();const $=id=>document.getElementById(id);
function render(){const c=cards[current];$('kicker').textContent=c.k;$('heading').textContent=c.h;$('body').textContent=c.b;$('visual').innerHTML=artwork;$('interaction').replaceChildren();if(c.q){const wrap=document.createElement('div');wrap.className='choices';c.q.forEach((option,i)=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=option;btn.addEventListener('click',()=>{wrap.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const feedback=$('feedback');if(i===c.answer){completed.add(current);feedback.className='feedback good';feedback.textContent=c.why}else{feedback.className='feedback bad';feedback.textContent='Not quite. Try another option.'}updateNav()});wrap.appendChild(btn)});$('interaction').appendChild(wrap);const fb=document.createElement('div');fb.id='feedback';fb.className='feedback';fb.setAttribute('role','status');$('interaction').appendChild(fb);if(completed.has(current)){fb.className='feedback good';fb.textContent='Completed ✓'}}updateNav()}
function updateNav(){const nav=$('milestones');nav.replaceChildren();cards.forEach((c,i)=>{const btn=document.createElement('button');btn.className='milestone'+(i===current?' current':'')+(completed.has(i)?' complete':'');btn.textContent=(c.q?'?':'▤')+(completed.has(i)?' ✓':'');btn.title=(c.q?'Question: ':'Learning: ')+c.h;btn.setAttribute('aria-label',btn.title);if(i===current)btn.setAttribute('aria-current','step');btn.disabled=i>furthest;btn.addEventListener('click',()=>jump(i));nav.appendChild(btn)});$('prev').disabled=current===0;$('next').disabled=current===cards.length-1||(!!cards[current].q&&!completed.has(current));$('next').textContent=current===cards.length-1?'Finished ✓':'Next →';$('count').textContent='Card '+(current+1)+' of '+cards.length;$('fill').style.width=((current+1)/cards.length*100)+'%'}
function jump(n){if(n<0||n>=cards.length||n>furthest)return;current=n;render()}\nfunction go(dir){if(dir>0&&!completed.has(current)&&cards[current].q)return;const n=current+dir;if(n<0||n>=cards.length)return;if(n>furthest)furthest=n;jump(n)}
$('prev').addEventListener('click',()=>go(-1));$('next').addEventListener('click',()=>go(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let startX=null;document.querySelector('.card').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});document.querySelector('.card').addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>70)go(delta<0?1:-1);startX=null},{passive:true});render();
</script>
</body></html>
