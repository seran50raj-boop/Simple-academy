name: Simple Academy rebuild validation
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/simple-academy-rebuild.yml'
  workflow_dispatch:
jobs:
  browser-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-academy-rebuild-test-results
          path: |
            rebuild/artifacts/
            rebuild/test-results/
          if-no-files-found: ignore
